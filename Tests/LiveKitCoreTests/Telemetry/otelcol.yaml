# Collector for the telemetry end-to-end test: accepts OTLP/HTTP on :4319 and writes every batch
# as one JSON line the test reads back. Run: otelcol-contrib --config Tests/LiveKitCoreTests/Telemetry/otelcol.yaml
# (CI downloads the binary in ci.yaml; no Docker on macOS runners, so no Grafana here.)
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4319
exporters:
  file:
    path: /tmp/livekit-telemetry-otlp.jsonl
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file]
    traces:
      receivers: [otlp]
      exporters: [file]
