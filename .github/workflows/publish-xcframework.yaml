name: Publish XCFramework

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to .version, e.g. 2.15.1)
        type: string
      dry_run:
        description: Build only, skip draft release / PR
        default: true
        type: boolean
  # Called by release.yml: once with dry_run before the tag, once to publish after it.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from (defaults to version, then main)
        type: string
      version:
        type: string
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read

env:
  HOSTING_REPO: livekit/client-sdk-swift-xcframework

jobs:
  build-and-publish:
    name: Build & publish XCFramework
    # Stays on macos-26: the iOS 13 / macOS 10.15 deployment floor is below Xcode 27's supported
    # range (iOS 15 / macOS 12). Xcode 27 can still archive all slices with the private setting
    # __DIAGNOSE_INVALID_DEPLOYMENT_TARGET_AS_ERROR=NO (via XCODE_XCCONFIG_FILE) plus explicit
    # deployment-target overrides, which Apple does not support; it is deliberately not applied.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.version || 'main' }}
          submodules: recursive
          # Needed to reach github.sha below, which is not an ancestor of the
          # checked-out tag.
          fetch-depth: 0

      # The checkout above pins the whole repo to the released tag, build tooling
      # included -- so a fix to scripts/ can never reach a version already tagged,
      # and re-running this job for it fails the same way forever. The SDK sources
      # must come from the tag, since that is the artifact's identity; the tooling
      # that packages them must not.
      #
      # After a release PR merges, take the tooling from the default branch. A
      # dispatch (of this workflow or of release.yml) keeps github.sha so that
      # changes to scripts/ can be exercised from a PR branch before they are merged.
      - name: Use current build tooling
        env:
          TOOLING_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('origin/{0}', github.event.repository.default_branch) }}
        run: |
          echo "Taking scripts/ from $TOOLING_REF"
          git checkout "$TOOLING_REF" -- scripts/
          git --no-pager diff --stat HEAD -- scripts/ || true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="$(cat .version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A second run for a version the hosting repo has skips the build and the
      # publish. The action refuses an existing release, so a repair run would fail.
      - name: Check the hosting repo
        id: done
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.XCFRAMEWORK_PAT }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$VERSION" --repo "$HOSTING_REPO" --json assets --jq '.assets[].name' 2>/dev/null) || exit 0
          prs=$(gh pr list --repo "$HOSTING_REPO" --head "release/$VERSION" --state all --json number --jq length)
          if grep -qx LiveKit.xcframework.zip <<< "$assets" && [ "$prs" -gt 0 ]; then
            echo "::notice::$HOSTING_REPO has release $VERSION and its PR. Skipping."
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$HOSTING_REPO has release $VERSION, but it is incomplete (assets: ${assets:-none}, PRs: $prs). Delete it with 'gh release delete $VERSION --repo $HOSTING_REPO --cleanup-tag', then run again."
            exit 1
          fi

      - name: Install swiftly
        if: steps.done.outputs.complete != 'true'
        run: |
          brew install swiftly swift-sh
          swiftly init --quiet-shell-followup --skip-install -y

      - name: Build XCFramework
        if: steps.done.outputs.complete != 'true'
        run: swiftly run +xcode swift-sh scripts/xcframework.swift --version "${{ steps.ver.outputs.version }}"

      - name: Publish to hosting repo
        if: ${{ !inputs.dry_run && steps.done.outputs.complete != 'true' }}
        uses: livekit/publish-xcframework-action@3b8645334fb62b0fd1d7067067819bcd111db157 # main
        with:
          xcframework-zip: .build/xcframework/LiveKit.xcframework.zip
          version: ${{ steps.ver.outputs.version }}
          hosting-repo: ${{ env.HOSTING_REPO }}
          files: |
            .build/xcframework/Package.swift:Package.swift
            .build/xcframework/LiveKitClient-XCFramework.podspec:LiveKitClient-XCFramework.podspec
            CHANGELOG.md:CHANGELOG.md
            README.md:README.md
            LICENSE:LICENSE
          token: ${{ secrets.XCFRAMEWORK_PAT }}
          pr-body: |
            Source release: https://github.com/livekit/client-sdk-swift/releases/tag/${{ steps.ver.outputs.version }}
