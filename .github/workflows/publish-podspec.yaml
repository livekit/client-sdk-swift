name: Publish Podspec

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish the podspec from (branch, tag, or SHA)
        default: main
        type: string
      dry_run:
        description: Validate only, don't open a PR
        default: true
        type: boolean
      spec_repo:
        description: Specs repo to publish to
        default: livekit/podspecs
        type: string
  workflow_call:
    inputs:
      ref:
        default: main
        type: string
      dry_run:
        default: true
        type: boolean
      spec_repo:
        default: livekit/podspecs
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Podspec
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.5

      - name: Publish
        uses: livekit/publish-cocoapod-action@089c62e30ff536886bac33f7e5dffb736ed27ed6 # main
        with:
          podspec: LiveKitClient.podspec
          spec-repo: ${{ inputs.spec_repo }}
          dry-run: ${{ inputs.dry_run }}
          token: ${{ secrets.PODSPECS_PAT }}
