name: CI

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
          - os: macos-15
            xcode: 16.4
            platform: "iOS Simulator,name=iPhone 16 Pro,OS=18.5"
          - os: macos-15
            xcode: 16.4
            platform: "macOS"
          - os: macos-15
            xcode: 16.4
            platform: "macOS,variant=Mac Catalyst"
          - os: macos-15
            xcode: 16.4
            platform: "tvOS Simulator,name=Apple TV,OS=18.5"

          # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          - os: macos-26
            xcode: 26.6
            platform: "iOS Simulator,name=iPhone 17 Pro,OS=26.5"
            symbol-graph: true
          - os: macos-26
            xcode: 26.6
            platform: "iOS Simulator,name=iPhone 17 Pro,OS=26.5"
            extension-api-only: true
          - os: macos-26
            xcode: 26.6
            platform: "macOS"
            symbol-graph: true
          - os: macos-26
            xcode: 26.6
            platform: "macOS"
            asan: true
          - os: macos-26
            xcode: 26.6
            platform: "macOS"
            tsan: true
          - os: macos-26
            xcode: 26.6
            platform: "macOS"
            strict-concurrency-env: true
          - os: macos-26
            xcode: 26.6
            platform: "macOS,variant=Mac Catalyst"
          - os: macos-26
            xcode: 26.6
            platform: "visionOS Simulator,name=Apple Vision Pro,OS=26.5"
          - os: macos-26
            xcode: 26.6
            platform: "tvOS Simulator,name=Apple TV,OS=26.5"

          # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-Readme.md
          - os: xcode-27
            xcode: latest
            platform: "macOS"
          - os: xcode-27
            xcode: latest
            platform: "macOS,variant=Mac Catalyst"
          - os: xcode-27
            xcode: latest
            platform: "iOS Simulator,name=iPhone 18 Pro,OS=27.0"
          - os: xcode-27
            xcode: latest
            platform: "visionOS Simulator,name=Apple Vision Pro,OS=27.0"
          # This image has no plain "Apple TV" device, unlike macos-15/macos-26.
          - os: xcode-27
            xcode: latest
            platform: "tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LIBDISPATCH_COOPERATIVE_POOL_STRICT: ${{ matrix.strict-concurrency-env == true && '1' || '0' }}
      NSUnbufferedIO: "YES"
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitizers/tsan.supp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Run LiveKit Server
        id: livekit-server
        uses: livekit/dev-server-action@61e2b4dcb170dd3591e0c9b0db3c3fe5db93b500
        with:
          github-token: ${{ github.token }}
          config: |
            room:
              departure_timeout: 1
            # Data track schema definitions are stored as participant data blobs.
            enable_participant_data_blob: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Xcode Version
        run: xcodebuild -version

      - name: Swift Version
        run: xcrun swift --version

      # Binary dependencies come from GitHub release assets, which answer with the odd 5xx.
      - name: Resolve Packages
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -scheme LiveKit && exit 0
            echo "Package resolution failed (attempt $attempt)"; sleep 20
          done
          exit 1

      # Boot ahead of the test step, so a cold runtime's first launch does not spend the test budget.
      # An optimization only: if it overruns, the test step targets the platform and boots it itself.
      - name: Boot Simulator
        id: boot
        if: contains(matrix.platform, 'Simulator')
        continue-on-error: true
        timeout-minutes: 10
        run: |
          step_end=$(( $(date +%s) + 9 * 60 ))
          platform='${{ matrix.platform }}'
          family=${platform%% Simulator*}; [ "$family" = "visionOS" ] && family=xrOS
          name=${platform#*name=}; name=${name%%,OS=*}; os=${platform##*OS=}
          runtime="com.apple.CoreSimulator.SimRuntime.${family}-${os//./-}"
          udid=$(xcrun simctl list devices available -j | jq -r --arg rt "$runtime" --arg n "$name" '.devices[$rt] // [] | map(select(.name==$n)) | .[0].udid // empty')
          [ -n "$udid" ] || { echo "No available simulator named '$name' on $runtime"; xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl spawn "$udid" launchctl print system > /dev/null 2>&1 || true
          # Booted is not idle: the runtime's processes keep several cores busy for a minute or
          # more afterwards. Wait for them to go quiet, for at most two minutes and never past the
          # step's own budget, however long the boot took.
          settle_end=$(( $(date +%s) + 120 )); [ "$settle_end" -gt "$step_end" ] && settle_end=$step_end
          sim_launchd=$(pgrep -x launchd_sim | head -1); quiet=0; cpu=
          while [ "$(date +%s)" -lt "$settle_end" ]; do
            cpu=$(ps -o %cpu= -p "$(pgrep -P "$sim_launchd" | paste -sd, -)" 2>/dev/null | awk '{s+=$1} END {printf "%d", s}')
            if [ "${cpu:-0}" -lt 20 ]; then quiet=$((quiet+1)); else quiet=0; fi
            [ "$quiet" -ge 3 ] && break
            sleep 2
          done
          echo "simulator settled at ${cpu:-?}% CPU"

      - name: Build & Test
        timeout-minutes: 30
        run: |
          # A hung job's log goes quiet; capture where the test host is stuck before the timeout kills it.
          .github/stall-dump/stall-dump.sh "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/stall-dump" &
          set -o pipefail && xcodebuild test \
            -scheme LiveKit \
            -destination '${{ steps.boot.outputs.udid && format('id={0}', steps.boot.outputs.udid) || format('platform={0}', matrix.platform) }}' \
            -collect-test-diagnostics never \
            -enableAddressSanitizer ${{ matrix.asan == true && 'YES' || 'NO' }} \
            -enableThreadSanitizer ${{ matrix.tsan == true && 'YES' || 'NO' }} \
            APPLICATION_EXTENSION_API_ONLY=${{ matrix.extension-api-only == true && 'YES' || 'NO' }} \
            -only-testing:LiveKitCoreTests \
            -only-testing:LiveKitNanopbTests \
            -only-testing:LiveKitObjCTests \
            -parallel-testing-enabled NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions

      # xcbeautify's github-actions renderer collapses a parameterized Swift Testing
      # failure to "Recorded an issue (1) argument(s)" — no message, no failing
      # argument. xcodebuild's own output has both, so keep it for post-mortems.
      - name: Upload Test Log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/stall-dump
          retention-days: 5

      # Client-side logs can't distinguish "we gave up" from "the SFU hung up on
      # us": a failed e2e test just shows `Connection reset by peer`. The server's
      # JSONL log records the participant close reason, so capture both sides.
      - name: Upload Server Log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ strategy.job-index }}
          path: ${{ steps.livekit-server.outputs.log-path }}
          retention-days: 5

      - name: Build for Release
        if: ${{ matrix.symbol-graph }}
        run: |
          set -o pipefail && xcodebuild build\
            -scheme LiveKit \
            -configuration Release \
            -destination 'platform=${{ matrix.platform }}'  \
            APPLICATION_EXTENSION_API_ONLY=${{ matrix.extension-api-only == true && 'YES' || 'NO' }} \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            OTHER_SWIFT_FLAGS="-Xfrontend -emit-symbol-graph\
                               -Xfrontend -emit-symbol-graph-dir\
                               -Xfrontend \"${PWD}/symbol-graph\"" \
            DOCC_EXTRACT_EXTENSION_SYMBOLS=YES | xcbeautify --renderer github-actions

      - name: Upload Symbol Graph
        if: ${{ matrix.symbol-graph }}
        uses: actions/upload-artifact@v7
        with:
          name: symbol-graph-${{ matrix.platform }}
          path: symbol-graph
          retention-days: 1
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: SwiftFormat Lint
        if: always()
        run: swiftformat --lint . --reporter github-actions-log
        # Comes pre-installed on macOS runners
  build-docs:
    name: Build Docs
    needs: build-and-test
    if: always()
    runs-on: macos-26
    steps:
      - name: Checkout Documentation Catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: Sources/LiveKit/LiveKit.docc

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Symbol Graphs
        uses: actions/download-artifact@v8
        with:
          pattern: symbol-graph-*
          path: symbol-graphs

      - name: List Symbol Graphs
        run: cd symbol-graphs && ls -al

      - name: Build Docs
        run: |
          $(xcrun --find docc) convert \
            Sources/LiveKit/LiveKit.docc \
            --output-dir docs \
            --additional-symbol-graph-dir symbol-graphs \
            --transform-for-static-hosting \
            --hosting-base-path /reference/client-sdk-swift/

      - name: Archive
        run: zip -r docs.zip docs

      - name: Upload Archive
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs.zip
          retention-days: 1
  app-size:
    name: App Size
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Hard budget for the SDK's uncompressed .app delta, in MB — no tolerance
      # band. Move it deliberately, in the same commit as the change that needs
      # it (the job summary reports the measured value).
      SIZE_BASELINE_MB: "17.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew install xcodegen swiftly swift-sh
          swiftly init --quiet-shell-followup --skip-install -y

      # Archives an empty app + a LiveKit app (unsigned, arm64 device slice) and
      # writes the size breakdown to the job summary, failing if over budget.
      - name: Measure app size
        run: |
          swiftly run +xcode swift-sh .github/size-check/size-check.swift \
            --baseline "$SIZE_BASELINE_MB"

  check-protocol:
    name: Check Protocol
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install swift-protobuf
        run: brew install protobuf swift-protobuf

      - name: Generate Swift protobuf files
        run: make proto

      - name: Check working tree
        run: |
          if ! git diff --quiet; then
            echo "::error::Working tree is not clean after running 'make proto'"
            echo "The following files have been modified:"
            git diff --name-only
            echo ""
            echo "Please run 'make proto' locally and commit the changes."
            exit 1
          else
            echo "Working tree is clean - all Swift protobuf files are up to date"
          fi

  check-tuist:
    name: Check Tuist
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: brew install tuist

      # Consumes the checkout with LiveKit as a per-target dynamic framework,
      # which fails to link on imports Package.swift does not declare (#1126).
      - name: Build Tuist example
        run: .github/tuist-check/run.sh

  check-changes:
    name: Check Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for .changes files
        id: check-changes
        run: |
          if [ -z "$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '^\.changes/')" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.check-changes.outputs.has_changes == 'false'
        uses: mshick/add-pr-comment@v3
        with:
          message: |
            ⚠️ This PR does not contain any files in the `.changes` directory.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
